name: Build and Deploy Site

on:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "课程总览/**"
      - "站点/**"
      - "PRINCIPLES.md"
      - ".githooks/**"
      - ".kimi-code/hooks/**"
      - "zreflect/**"
      - "reflect-local/**"
      - "ruff.toml"
      - "right.json"
      - ".github/workflows/**"
  workflow_dispatch: {}
  issues:
    types: [closed, reopened]

concurrency:
  group: deploy-site
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build site & push to isui.ren-heart
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # node 26（26.12.1 起）：2026-10 安全修复线（Brotli RCE / DNS /
          # TLS ×2 四项全修）；check-latest 防 runner 镜像缓存滞后（act 下跳过联网探测）。
          node-version: 26
          check-latest: ${{ !env.ACT }}

      - name: Ensure fontTools, brotli, ruff & shellcheck
        run: |
          set -euo pipefail
          python3 -m ruff --version >/dev/null 2>&1 || pip3 install --break-system-packages -q ruff==0.17.3
          if ! command -v shellcheck >/dev/null 2>&1; then
            SUDO=""
            if [ "$(id -u)" -ne 0 ] && command -v sudo >/dev/null 2>&1; then SUDO="sudo"; fi
            $SUDO apt-get update -qq && $SUDO apt-get install -y -qq --no-install-recommends shellcheck
          fi
          if [ -n "${ACT:-}" ]; then
            python3 -c "import fontTools, brotli" 2>/dev/null || pip3 install --break-system-packages -q fonttools brotli
          fi

      - name: Lint (Ruff / ShellCheck / ESLint) & build static site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          npm --prefix 站点 ci --ignore-scripts --no-audit --no-fund
          python3 -m ruff check zreflect reflect-local .githooks
          shellcheck -x .githooks/pre-commit .githooks/pre-push .kimi-code/hooks/einfacht-next.sh .kimi-code/hooks/selftest.sh
          npm --prefix 站点 run lint
          # 零构建期依赖：搜索索引由 plugins/site-search.mjs 在 build.mjs 里直接产出
          # （此前用 pagefind，但它按单字索引中文，已弃用）。
          npm --prefix 站点 run build
          # 顺手跑一遍插件测试、公式核心测试、hook 测试与版权门禁
          npm --prefix 站点 test
          node --test 站点/math/math.test.mjs
          python3 .githooks/test-update-readme.py
          python3 zreflect/check_right.py --spec right.json
          python3 zreflect/check_right.py --spec 站点/right-dist.json

      - name: Deploy to isui.ren-heart@deploy
        if: ${{ !env.ACT }}
        env:
          HEART_DEPLOY_KEY: ${{ secrets.HEART_DEPLOY_KEY }}
          REPO_NAME: S26-1_202609
        run: |
          set -euo pipefail

          # 配置 SSH Key
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$HEART_DEPLOY_KEY" > ~/.ssh/heart_deploy_key
          chmod 600 ~/.ssh/heart_deploy_key
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts

          cat > ~/.ssh/config <<'SSHCFG'
          Host github.com
            HostName github.com
            IdentityFile ~/.ssh/heart_deploy_key
            IdentitiesOnly yes
          SSHCFG
          chmod 600 ~/.ssh/config

          # Clone isui.ren-heart 的 deploy 分支
          rm -rf /tmp/heart-deploy
          git clone --depth 1 --branch deploy \
            git@github.com:ArchivalEra/isui.ren-heart.git \
            /tmp/heart-deploy

          # 同步产物到 repo/S26-1_202609/
          cd /tmp/heart-deploy
          mkdir -p repo/"$REPO_NAME"
          rm -rf repo/"$REPO_NAME"/*
          cp -r "$GITHUB_WORKSPACE/站点/dist/." repo/"$REPO_NAME"/

          # 提交与推送
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repo/"$REPO_NAME"

          if git diff --staged --quiet; then
            echo "No changes in built site to commit."
          else
            git commit -m "deploy: update repo/$REPO_NAME from commit ${GITHUB_SHA:0:8} at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin deploy
            echo "Successfully deployed repo/$REPO_NAME to isui.ren-heart@deploy!"
          fi

# Pagefind 索引配置。
#
# 为什么要排除 KaTeX：公式节点内部用 <annotation> 保存原始 LaTeX
# （如 D\neq0、\begin{vmatrix}），索引进去会让搜索命中这些源码，
# 既搜不出公式本身、又污染结果。排除后索引词数从 5205 降到 2916。
#
# 为什么排除侧栏/目录/调色盘：这些是每页重复的导航与 UI 文字，
# 索引它们会让"主题强调色""Hue 248"这类字样出现在搜索结果里。
exclude_selectors:
  - "span.katex"
  - "span.katex-display"
  - "span.katex-mathml"
  - ".katex-error"
  - "[data-pagefind-ignore]"
  - ".search-panel"
  - ".m3-drawer"
  - ".m3-toc"
  - ".m3-paging-container"
  - ".meta-chip-bar"
  - ".m3-breadcrumb"
  - ".top-bar-breadcrumb"
  - ".palette-popover"
  - ".drawer-backdrop"

# 只索引正文区域。页面模板把正文放在 .article-content 里，
# 这样标题之外的页眉、页脚、导航都不会进索引。
root_selector: ".article-content"
